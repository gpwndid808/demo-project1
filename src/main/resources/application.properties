# ===============================
# TODO [1단계] application.properties 이해하기
#  - Spring Boot 애플리케이션의 설정 파일입니다.
#  - 데이터베이스 연결, JPA 설정 등을 관리합니다.
#  💡 학습 포인트: application.yml 형식도 사용 가능합니다.
# ===============================

spring.application.name=demo-project1

# TODO [2단계] 서버 포트 설정
#  - 애플리케이션이 실행될 포트 번호를 지정합니다.
#  - 기본값은 8080입니다.
#  💡 실습: 다른 포트로 변경하고 실행해보세요.
server.port=8080

# ===============================
# TODO [2단계] 데이터베이스 연결 설정
#  - MySQL 데이터베이스 연결 정보를 설정합니다.
#  - url: 데이터베이스 주소 (localhost:3306/test_board)
#  - username/password: 데이터베이스 접속 계정
#  💡 주의: 실제 운영 환경에서는 비밀번호를 코드에 직접 작성하지 않습니다.
#  💡 대안: 환경 변수, AWS Secrets Manager 등 활용
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/test_board?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# TODO [2단계] H2 데이터베이스로 간편하게 시작하기 (선택사항)
#  - MySQL 설치가 어렵다면 H2 인메모리 DB를 사용하세요.
#  - 아래 주석을 해제하고 위 MySQL 설정을 주석 처리하세요:
#  spring.datasource.url=jdbc:h2:mem:testdb
#  spring.datasource.driver-class-name=org.h2.Driver
#  spring.h2.console.enabled=true
#  💡 실습: http://localhost:8080/h2-console 에서 DB 확인 가능

# ===============================
# TODO [2단계] JPA Hibernate DDL 설정
#  - create: 기존 테이블 삭제 후 재생성 (개발 초기)
#  - update: 변경된 스키마만 반영 (개발 중)
#  - validate: 스키마 검증만 수행 (운영)
#  - none: 아무 작업도 하지 않음 (운영)
#  💡 주의: 운영 환경에서는 절대 create 사용 금지!
# ===============================
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
server.error.include-message=always
server.error.include-binding-errors=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# TODO [2단계] Open In View 설정
#  - false: OSIV(Open Session In View) 비활성화 권장
#  - 트랜잭션 범위를 명확히 하여 성능 문제 방지
#  💡 학습 포인트: OSIV 패턴의 장단점 학습
spring.jpa.open-in-view=false

# TODO [2단계] SQL 포맷팅
#  - 실행되는 SQL을 보기 좋게 포맷팅합니다.
#  - 학습 시 매우 유용합니다!
spring.jpa.properties.hibernate.format_sql=true

# TODO [2단계] SQL 로그 확인
#  - debug: 실행되는 SQL 쿼리를 콘솔에 출력
#  - 💡 추가 설정: 쿼리 파라미터 값도 보려면
#  - logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace
#  💡 실습: 애플리케이션 실행 후 API 호출 시 콘솔에서 SQL 확인
logging.level.org.hibernate.SQL=debug

# TODO [4단계] 쿼리 파라미터 로깅 (선택사항)
